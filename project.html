<script>
var projects = [
  { id: "navbot", year: "2025", title: "NavBot: Hospital Navigation Robot", category: "mechanical", thumbnail: "assets/img/portfolio/thumbnailForNavBot.png", description: "Alongside a team of collaborators, I led the ideation and contributed to the development of NavBot, an autonomous hospital navigation robot built on the VEX IQ platform using C++. The project aimed to reduce repetitive workload for hospital staff, enable secure medication delivery, demonstrate practical autonomy with minimal hardware, and apply graph-based algorithms to real-world robotics problems. I played a key role in shaping the system’s overall design and direction, while contributing to the integration of sensor-based safety features such as obstacle detection and collision handling to ensure reliable operation in dynamic environments. NavBot operates as a fully self-contained system with a controller-based interface, showcasing the application of algorithms and embedded systems to improve efficiency in healthcare settings.", tech: ["C++", "VEX IQ", "Solidworks"], github: "https://github.com/KeshavMalhotra10/navBot", demo: null, medium: null, video: "https://www.youtube.com/watch?v=rkE9pB7YZUg", images: [] },
  { id: "roboventure", year: "2024", title: "Roboventure Robotics Workshop", category: "video", thumbnail: "assets/img/portfolio/roboventure.jpeg", description: "I led RoboVenture, a community-driven robotics initiative designed to make STEM education accessible to underprivileged students, funded by Promise1000 Canada. Working alongside members of my robotics team, I developed and delivered hands-on workshops introducing participants to Arduino programming, basic circuitry, and mechanical tool usage. The program emphasized experiential learning, allowing students to build and experiment with real hardware while gaining confidence in technical skills. Through this initiative, I helped cultivate strong interest in robotics within the community, growing our team from 12 to over 50 members and establishing a sustainable pipeline of new, engaged students.", tech: ["Arduino", "Breadboarding", "C++"], github: null, demo: null, medium: null, video: "https://www.youtube.com/watch?v=sBWyKxTF7IU", images: [] },
  { id: "jobfit", year: "2026", title: "JobFit: AI Resume Analyzer", category: "programming", thumbnail: "assets/img/portfolio/jobfitSS.png", description: "JobFit — AI Resume Analyzer. When applying to internships, I kept wondering if my resume would actually pass ATS filters, so I built a tool to find out. Paste a job posting and JobFit scores your resume against it, returning an ATS match score, missing keywords, strong experience matches, and the exact resume sections that drove the analysis. Under the hood it uses a RAG pipeline: your resume gets chunked, embedded, and retrieved via cosine similarity before being injected into a structured GPT prompt, so every result is traceable, not a black box.", tech: ["Python", "Flask", "OpenAI", "NumPy", "RAG", "Render"], github: "https://github.com/KeshavMalhotra10/JobFit_Resume_Analyzer", demo: "https://jobfit-3tgb.onrender.com/", medium: null, video: "https://youtu.be/wVwTmoXA0uU", images: [] },
  { id: "heart-disease", year: "2023", title: "Using AI to predict Heart Disease", category: "programming", thumbnail: "assets/img/portfolio/gradientDescent.webp", description: "Developed a logistic regression model to predict heart disease risk using clinical data. Features are combined through a weighted dot product and passed through a sigmoid activation to produce probabilistic outputs. The model is optimized using gradient descent on a cost function, with experiments in learning rate and parameter initialization achieving ~90% accuracy.", tech: ["Machine Learning", "PyTorch", "NumPy", "Matplotlib", "Jupyter Notebook"], github:null, kaggle: "https://www.kaggle.com/code/keshavmalhotra10/keshav-heart-disease-algorithm?source=post_page-----5363555a0152---------------------------------------", medium:"https://medium.com/@malhotrakeshav10/using-a-i-to-predict-heart-disease-5363555a0152" , video:null , images: ["assets/img/portfolio/gradientDescent.webp"] },

];

var CAT_LABEL = { mechanical: "Mechanical", programming: "Programming", hardware: "Hardware", video: "Video", research: "Research" };

function ytId(url) {
  if (!url) return null;
  var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^?&]+)/);
  return m ? m[1] : null;
}

function render() {
  var id = new URLSearchParams(window.location.search).get("id");
  var p = null;
  for (var i = 0; i < projects.length; i++) { if (projects[i].id === id) { p = projects[i]; break; } }
  var app = document.getElementById("app");

  if (!p) {
    app.innerHTML = '<div class="not-found"><h1>Project not found</h1><p><a href="index.html#projects">← Back to all projects</a></p></div>';
    return;
  }

  document.title = p.title + " — Keshav Malhotra";

  var vid = ytId(p.video);
  var links = [];
  if (p.demo)   links.push('<a href="' + p.demo   + '" target="_blank" rel="noopener">Live demo ↗</a>');
  if (p.kaggle) links.push('<a href="' + p.kaggle + '" target="_blank" rel="noopener">View on Kaggle ↗</a>');
  if (p.github) links.push('<a href="' + p.github + '" target="_blank" rel="noopener">View on GitHub ↗</a>');
  if (p.medium) links.push('<a href="' + p.medium + '" target="_blank" rel="noopener">Read on Medium ↗</a>');

  var media = "";
  if (vid || p.images.length) {
    media = '<div class="doc-media">';
    if (vid) media += '<figure class="taped"><div class="video"><iframe src="https://www.youtube.com/embed/' + vid + '" title="' + p.title + ' video" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></figure>';
    media += p.images.map(function(s) { return '<figure class="taped"><img src="' + s + '" alt="' + p.title + '" loading="lazy"/></figure>'; }).join("");
    media += '</div>';
  }

  app.innerHTML =
    '<header class="doc-head">' +
      '<p class="entry-line"><time datetime="' + p.year + '">' + p.year + '</time> — ' + (CAT_LABEL[p.category] || p.category).toLowerCase() + '</p>' +
      '<h1>' + p.title + '</h1>' +
      '<p class="doc-meta">' + p.tech.join(", ") + '</p>' +
      (links.length ? '<p class="doc-links">' + links.join("") + '</p>' : '') +
    '</header>' +
    media +
    '<section class="case-sec">' +
      '<h2>About this project</h2>' +
      '<p class="body-text">' + p.description + '</p>' +
    '</section>';
}

render();
</script>
